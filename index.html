<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Don't forget</title>
    <meta name="theme-color" content="#1e3a5f" />
    <link rel="icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Don't forget" />
    <script id="theme-init">
      (function () {
        var mode = 'system';
        try { var v = localStorage.getItem('theme'); if (v === 'light' || v === 'dark' || v === 'system') mode = v; } catch (e) {}
        document.documentElement.classList.toggle('dark', mode === 'dark' || (mode === 'system' && !!matchMedia('(prefers-color-scheme: dark)').matches));
      })();
    </script>
    <script id="boot-error">
      (function () {
        function show(msg) {
          var app = document.getElementById('app');
          if (app && !app.firstChild) { app.innerHTML = '<pre style="white-space:pre-wrap;padding:16px;font:14px monospace"></pre>'; app.firstChild.textContent = 'Startfehler: ' + msg; }
        }
        window.addEventListener('error', function (e) { setTimeout(function () { show(e.message || 'Skript konnte nicht geladen werden'); }, 0); }, true);
        window.addEventListener('unhandledrejection', function (e) { show(String((e.reason && e.reason.message) || e.reason)); });
        setTimeout(function () { show('Die App ist nach 8 Sekunden nicht erschienen.'); }, 8000);
      })();
    </script>
  </head>
  <body class="bg-page text-ink antialiased">
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
