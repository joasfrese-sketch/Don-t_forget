name: Windows-App bauen

# Baut den Installer für den Windows-PC (nicht signiert, kein Store, nichts wird veröffentlicht).
# Die Datei liegt danach als Artifact beim Lauf (Actions → Lauf anklicken → ganz unten „Artifacts“).
# Die Einheitentests laufen im Workflow „Android-App bauen“ auf Linux.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Web-Teil bauen
        run: npm run build

      - name: Installer bauen
        run: npx electron-builder --win nsis --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: dont-forget-windows
          path: release/Dont-forget-Setup.exe
          if-no-files-found: error
