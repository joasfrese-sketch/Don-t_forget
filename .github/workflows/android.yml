name: Android-App bauen

# Baut die APK zum direkten Installieren auf dem Handy (debug-signiert, kein Store, nichts wird veröffentlicht).
# Die Datei liegt danach als Artifact beim Lauf (Actions → Lauf anklicken → ganz unten „Artifacts“).
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Das Android-SDK ist auf dem Runner schon installiert; es fehlen nur die akzeptierten Lizenzen.
      - name: Android-SDK-Lizenzen akzeptieren
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Tests
        run: npx vitest run

      - name: Web-Teil bauen
        run: npm run build

      - name: In das Android-Projekt übernehmen
        run: npx cap sync android

      - name: APK bauen
        working-directory: android
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: dont-forget-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
